# XcodeGen spec. This file is the source of truth; Microkit.xcodeproj is generated with
# `xcodegen generate` and gitignored.
name: Microkit
options:
  bundleIdPrefix: in.pooya
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  MicrokitCore:
    path: Packages/MicrokitCore

schemes:
  Microkit:
    build:
      targets:
        Microkit: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Microkit:
    type: application
    platform: macOS
    sources:
      - path: Microkit
    dependencies:
      - package: MicrokitCore
    settings:
      base:
        PRODUCT_NAME: Microkit
        PRODUCT_BUNDLE_IDENTIFIER: in.pooya.microkit
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        # Apple Development identity on this Mac. The team is the certificate's OU (37MA269X54),
        # not the ID in brackets in its name (FTQDQPMU3H, the person): check with
        # security find-certificate -c "Apple Development" -p | openssl x509 -noout -subject
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 37MA269X54
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        # Microkit/Resources/AppIcon.icon (Icon Composer). Xcode builds the legacy icns from it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          # A dev build and an installed release coexist, each with its own defaults.
          PRODUCT_BUNDLE_IDENTIFIER: in.pooya.microkit.debug
    info:
      path: Microkit/Info.plist
      properties:
        CFBundleDisplayName: Microkit
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        NSAudioCaptureUsageDescription: "Microkit listens to the sound playing on your Mac to light your keyboard in time with the music. The sound is analyzed on this Mac and never recorded or sent anywhere."
        NSHumanReadableCopyright: ""
    entitlements:
      path: Microkit/Microkit.entitlements
      properties:
        # House rule: sandbox off. Raw HID needs no entitlement unsandboxed.
        com.apple.security.app-sandbox: false
